<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2119"/>
      <stop offset="100%" stop-color="#14110e"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f2ea"/>
      <stop offset="100%" stop-color="#e0cfae"/>
    </linearGradient>
  </defs>

  <!-- Background square with rounded corners -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect width="100" height="100" rx="22" fill="none" stroke="rgba(246,242,234,0.10)" stroke-width="1.5"/>

  <!-- FN monogram -->
  <text
    x="12"
    y="68"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="54"
    font-weight="800"
    letter-spacing="-3"
    fill="url(#text-grad)"
  >FN</text>
</svg>
